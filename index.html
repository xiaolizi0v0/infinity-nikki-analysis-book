<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>析境 · 可视化拆解工作台</title>
<link rel="icon" type="image/x-icon" href="icon.ico?v=88">
<meta name="theme-color" content="#F6F3FC">
<script>
/* 生效主题要在首帧前落到 <html>，避免闪白 */
(function () {
  try {
    var t = localStorage.getItem('nk.theme.v1');
    var ok = { snow: 1, warm: 1, mint: 1, rose: 1, night: 1 };
    document.documentElement.dataset.theme = ok[t] ? t : 'snow';
  } catch (e) { document.documentElement.dataset.theme = 'snow'; }
})();
</script>
<link rel="stylesheet" href="css/theme.css?v=88">
<link rel="stylesheet" href="css/app.css?v=88">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="logo"><span>∞</span></div>
    <div class="brand-txt">
      <input id="doc-title" class="doc-title" spellcheck="false" value="未命名拆解书">
      <div class="brand-sub">
        <button id="save-state" class="save-state" data-state="idle" title="点击立即保存（Ctrl+S）"><i></i><span>未保存</span></button>
        <button id="file-chip" class="file-chip" hidden title="已关联设备上的文件，点击立即写入"></button>
        <i class="sub-sep">·</i>析境 · 无限画布
      </div>
    </div>
  </div>

  <div class="addslot">
    <button class="addcomp" id="btn-add-component" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="component-library" title="打开组件库（Ctrl/⌘ + K）">
      <svg class="addcomp-plus" viewBox="0 0 16 16" fill="none"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      <span>添加组件</span>
      <svg class="addcomp-chev" viewBox="0 0 12 12" fill="none"><path d="M3 4.5l3 3 3-3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="clib" id="component-library" role="dialog" aria-label="组件库" hidden></div>
  </div>

  <div class="tools">
    <button class="icon-btn" id="btn-undo" title="撤销 Ctrl+Z">
      <svg viewBox="0 0 20 20" fill="none"><path d="M7.5 7H12a4 4 0 010 8H8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M9.5 4.5L6.5 7l3 2.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="icon-btn" id="btn-redo" title="重做 Ctrl+Shift+Z">
      <svg viewBox="0 0 20 20" fill="none"><path d="M12.5 7H8a4 4 0 000 8h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M10.5 4.5L13.5 7l-3 2.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>

    <div class="zoomgrp">
      <button id="zoom-out" title="缩小">−</button>
      <button id="zoom-label" title="恢复 100%">100%</button>
      <button id="zoom-in" title="放大">＋</button>
    </div>

    <button class="tbtn" id="btn-fit" title="适应屏幕 (F)">适应</button>
    <button class="tbtn" id="btn-present" title="进入演示 (P)">演示</button>
    <button class="icon-btn" id="btn-new" title="新建拆解书（空白 / 骨架 / 示例）">
      <svg viewBox="0 0 20 20" fill="none"><path d="M11.2 2.8H6a2 2 0 00-2 2v10.4a2 2 0 002 2h8a2 2 0 002-2V7.6z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M11 3v4.6h4.6" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M10 10.6v3.4M8.3 12.3h3.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    </button>
    <button class="tbtn primary" id="btn-save" title="保存为 .nkdraw 画布文件（Ctrl+S）">保存</button>
    <button class="tbtn" id="btn-load" title="打开 .nkdraw 画布文件（兼容旧版 .json）">打开</button>
    <button class="icon-btn theme-btn" id="btn-theme" title="配色主题（点击切换 · T）" aria-haspopup="true" aria-expanded="false">
      <svg viewBox="0 0 20 20" fill="none">
        <circle cx="10" cy="10" r="7.1" stroke="currentColor" stroke-width="1.4"/>
        <circle cx="7.5" cy="8.2" r="1.45" fill="currentColor"/>
        <circle cx="10.6" cy="6.5" r="1.45" fill="currentColor"/>
        <circle cx="13" cy="9.4" r="1.45" fill="currentColor"/>
        <circle cx="8.4" cy="12.2" r="1.45" fill="currentColor"/>
      </svg>
    </button>
    <div class="theme-pop" id="theme-pop" role="dialog" aria-label="配色主题">
      <b class="tp-title">配色主题</b>
      <span class="tp-sub">界面、画布、图表同步换色</span>
      <div class="tp-grid" id="tp-grid"></div>
      <div class="tp-foot"><kbd>T</kbd> 快速轮换 · 仅改变外观，不影响拆解书内容</div>
    </div>
    <button class="icon-btn more" id="btn-more" title="更多">
      <svg viewBox="0 0 20 20"><circle cx="5" cy="10" r="1.4" fill="currentColor"/><circle cx="10" cy="10" r="1.4" fill="currentColor"/><circle cx="15" cy="10" r="1.4" fill="currentColor"/></svg>
    </button>
    <div class="menu" id="menu-more">
      <button id="menu-theme"><span>配色主题…</span><kbd>T</kbd></button>
      <button id="menu-new"><span>新建拆解书…</span><kbd>空白 / 骨架</kbd></button>
      <div class="menu-sep"></div>
      <button id="menu-save"><span>保存到浏览器</span><kbd>Ctrl S</kbd></button>
      <button id="menu-save-as"><span>另存为 .nkdraw…</span></button>
      <button id="menu-open-file"><span>打开 .nkdraw / .json…</span></button>
      <button id="menu-export-nk"><span>导出 .nkdraw 文件</span><kbd>Ctrl E</kbd></button>
      <button id="menu-export"><span>导出 JSON（旧格式）</span></button>
      <button id="menu-export-md"><span>导出 Markdown（AI 阅读资料）</span></button>
      <button id="menu-unlink"><span>取消文件关联</span></button>
      <button id="menu-print"><span>打印当前视图</span></button>
      <div class="menu-sep"></div>
      <button id="menu-snap"><span>存为快照</span><kbd>版本</kbd></button>
      <div class="menu-sep"></div>
      <div class="menu-cap">历史快照 · 最多 6 条</div>
      <div class="menu-snaps" id="menu-snaps"></div>
      <div class="menu-sep"></div>
      <button id="menu-reset">重置为示例内容</button>
      <button id="menu-clear">清除本地存档</button>
      <button id="menu-shortcuts">快捷键一览</button>
    </div>
  </div>
</header>

<main class="workspace">
  <aside class="panel left">
    <div class="panel-head">
      <span class="panel-title">大纲<i class="panel-board" id="outline-board" hidden></i></span>
      <span class="ct" id="el-count">0 个组件</span>
    </div>
    <div class="outline" id="outline"></div>
    <div class="panel-foot">
      <div class="stats" id="type-stat"></div>
      <div class="foot-tip">点击条目可定位组件 · 双击文字直接编辑</div>
    </div>
  </aside>

  <div class="canvas-wrap" id="canvas-wrap">
    <div class="grid" id="grid"></div>
    <div class="world" id="world"></div>
    <div class="sel-overlay" id="sel-overlay"></div>
    <div class="corner-hint">
      <kbd>左键</kbd>拖拽框选 · <kbd>空格</kbd>拖动 · <kbd>Ctrl</kbd><kbd>滚轮</kbd>缩放 · <kbd>双击</kbd>编辑
    </div>
    <div class="minimap">
      <canvas id="minimap-canvas"></canvas>
      <span class="mini-tag">总览</span>
    </div>

    <!-- 多画布：底部画布条 -->
    <div class="boardbar" id="boardbar">
      <button class="bb-ico" id="bb-add" title="新建画布">
        <svg viewBox="0 0 20 20" fill="none"><path d="M10 4.4v11.2M4.4 10h11.2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      </button>
      <button class="bb-ico" id="bb-all" title="全部画布（重命名 / 复制 / 删除）">
        <svg viewBox="0 0 20 20" fill="none"><path d="M4.4 6h11.2M4.4 10h11.2M4.4 14h11.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
      <div class="bb-tabs" id="bb-tabs"></div>
    </div>
    <div class="bb-panel" id="bb-panel"></div>
    <div class="bb-menu" id="bb-menu"></div>
  </div>

  <aside class="panel right" id="inspector"></aside>
</main>

<input type="file" id="file-image" accept="image/*" hidden>
<input type="file" id="file-json" accept=".nkdraw,.json,application/x-nkdraw,application/json" hidden>

<div id="toast" class="toast"></div>

<script src="js/util.js?v=88"></script>
<script src="js/theme.js?v=88"></script>
<script src="js/nkformat.js?v=88"></script>
<script src="js/files.js?v=88"></script>
<script src="js/flowchart.js?v=88"></script>
<script src="js/statediagram.js?v=88"></script>
<script src="js/store.js?v=88"></script>
<script src="js/marks.js?v=88"></script>
<script src="js/tables.js?v=88"></script>
<script src="js/component-registry.js?v=88"></script>
<script src="js/advanced-components.js?v=88"></script>
<script src="js/groups.js?v=88"></script>
<script src="js/render.js?v=88"></script>
<script src="js/canvas.js?v=88"></script>
<script src="js/boards.js?v=88"></script>
<script src="js/panels.js?v=88"></script>
<script src="js/component-library.js?v=88"></script>
<script src="js/floweditor.js?v=88"></script>
<script src="js/ereditor.js?v=88"></script>
<script src="js/stateeditor.js?v=88"></script>
<script src="js/imgeditor.js?v=88"></script>
<script src="js/texteditor.js?v=88"></script>
<script src="js/tableeditor.js?v=88"></script>
<script src="js/cardeditor.js?v=88"></script>
<script src="js/advanced-editor.js?v=88"></script>
<script src="js/mdexport.js?v=88"></script>
<script src="js/newdoc.js?v=88"></script>
<script src="js/app.js?v=88"></script>
</body>
</html>
